
name: Build TouchBarOff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Intel version
        run: |
          swiftc -O \
            -target x86_64-apple-macos11.0 \
            main.swift -o touchbar-intel

      - name: Build Apple Silicon version
        run: |
          swiftc -O \
            -target arm64-apple-macos11.0 \
            main.swift -o touchbar-arm

      
      - name: Create universal application
        run: |
          mkdir -p TouchBarOff.app/Contents/MacOS

          cp Info.plist TouchBarOff.app/Contents/Info.plist

          lipo -create \
            touchbar-intel touchbar-arm \
            -output TouchBarOff.app/Contents/MacOS/TouchBarOff

          chmod 755 TouchBarOff.app/Contents/MacOS/TouchBarOff

          codesign --force --sign - TouchBarOff.app

      - name: Package and verify application
        run: |
          # Check the executable was created
          test -x TouchBarOff.app/Contents/MacOS/TouchBarOff

          # Create ZIP preserving the .app folder
          ditto -c -k --sequesterRsrc --keepParent \
            TouchBarOff.app TouchBarOff.zip

          # Extract ZIP on the build machine
          mkdir verification
          ditto -x -k TouchBarOff.zip verification

          # Verify the extracted executable exists
          test -x verification/TouchBarOff.app/Contents/MacOS/TouchBarOff

          # Verify the application bundle
          codesign --verify --verbose=2 \
            verification/TouchBarOff.app

          echo "Application successfully packaged and verified"

      - name: Upload finished application
        uses: actions/upload-artifact@v4
        with:
          name: TouchBarOff-macOS
          path: TouchBarOff.zip
          retention-days: 30
